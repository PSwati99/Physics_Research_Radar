# ==================================================================
#  Physics Research Radar - settings
#  Edit this file to change what the weekly digest collects.
# ==================================================================

days_back: 14         # how many days back each run looks. 14 for the FIRST run only, then change to 7
min_score: 4          # papers scoring below this are dropped (raise it for fewer, tighter results)
featured_score: 8     # papers at or above this score, or by a watched author, become "top picks"
max_per_topic: 20     # at most this many papers shown per topic each week
contact_email: sswati1@vols.utk.edu   # sent to Crossref only, never shown on the website

# arXiv categories: every paper submitted to these is downloaded, then scored
arxiv_categories:
  - cond-mat.str-el      # strongly correlated: spin ice, spin liquids, quantum magnets
  - cond-mat.mes-hall    # mesoscale: spintronics, spin Seebeck, spin transport
  - cond-mat.mtrl-sci    # materials: thin films, interfaces, quantum materials
  - cond-mat.stat-mech   # statistical mechanics: quench, nonequilibrium, spin glass, Monte Carlo
  - cond-mat.dis-nn      # disordered systems: spin glasses, machine learning in physics
  - physics.ins-det      # instrumentation and detectors
  - physics.app-ph       # applied physics: sensing, magnetometry, devices

# Journals, found through the Crossref API by ISSN
journals:
  Physical Review Letters: "0031-9007"
  Physical Review B: "2469-9950"
  Physical Review X: "2160-3308"
  Physical Review Materials: "2475-9953"
  Physical Review Applied: "2331-7019"
  Physical Review Research: "2643-1564"
  Nature Physics: "1745-2473"
  Nature Materials: "1476-1122"
  Nature Communications: "2041-1723"
  Science: "0036-8075"
  npj Quantum Materials: "2397-4648"
  Journal of Magnetism and Magnetic Materials: "0304-8853"
  Applied Physics Letters: "0003-6951"
  Journal of Physics Condensed Matter: "0953-8984"
  Review of Scientific Instruments: "0034-6748"
  Nuclear Instruments and Methods A: "0168-9002"
  Journal of Applied Crystallography: "1600-5767"
  Journal of Instrumentation: "1748-0221"
  Journal of Neutron Research: "1023-8166"
  Cryogenics: "0011-2275"

